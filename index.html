<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#292824">
  <meta name="description" content="高中公民互動闖關網站《規則之城》">
  <title>規則之城｜入境大廳</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="hall.css">
</head>
<body class="hall">
  <main class="scene" id="scene" aria-label="規則之城入境大廳">
    <header class="masthead">
      <div><h1>規則之城</h1><p>入境大廳</p></div>
      <div class="hall-tools"><div class="progress" id="progress" aria-live="polite">已踏入 0 / 6 道規則</div><button id="hallMenuToggle" class="hall-menu-toggle" type="button" aria-label="開啟大廳選單" aria-expanded="false">⋯</button><div id="hallMenu" class="hall-menu" hidden><button id="hallRestartCity" type="button">重新開始規則之城</button><button id="hallMenuClose" type="button">關閉</button></div></div>
    </header>
    <p class="unlock-message" aria-live="polite">FINAL GATE UNLOCKED<br><span>規則終章</span></p>
    <button class="final-gate" id="finalGate" type="button" aria-disabled="true"><b>FINAL GATE</b><span>規則終章</span><small>完成六道關卡後開啟</small></button>
    <button class="gate gate-1" type="button" data-gate="1" data-href="gate1/index.html"><b>GATE 1</b><span>放學後的203</span></button>
    <button class="gate gate-2" type="button" data-gate="2" data-href="gate-2/index.html"><b>GATE 2</b><span>立法院走廊</span></button>
    <button class="gate gate-3" type="button" data-gate="3" data-href="gate-3/index.html"><b>GATE 3</b><span>解釋的邊界</span></button>
    <button class="gate gate-4" type="button" data-gate="4" data-href="gate-4/index.html"><b>GATE 4</b><span>權利檔案室</span></button>
    <button class="gate gate-5" type="button" data-gate="5" data-href="gate5/index.html"><b>GATE 5</b><span>規則失控夜</span></button>
    <button class="gate gate-6" type="button" data-gate="6" data-href="gate6/index.html"><b>GATE 6</b><span>憲法之前</span></button>

    <section class="teacher-dialog" id="teacherDialog" role="dialog" aria-modal="true" aria-labelledby="teacherDialogTitle" hidden>
      <div class="teacher-dialog__backdrop" data-dialog-close="true"></div>
      <div class="teacher-dialog__panel">
        <img class="teacher-dialog__portrait" src="assets/images/civic-teacher-v1.png" alt="">
        <div class="teacher-dialog__paper">
          <h2 id="teacherDialogTitle"></h2>
          <p id="teacherDialogMessage"></p>
          <div class="teacher-dialog__actions" id="teacherDialogActions"></div>
        </div>
      </div>
    </section>
    <section class="hall-reset-confirm" id="hallResetConfirm" role="dialog" aria-modal="true" aria-labelledby="hallResetTitle" hidden>
      <div class="hall-reset-confirm__backdrop"></div>
      <div class="hall-reset-confirm__card"><p>入境大廳</p><h2 id="hallResetTitle">重新開始規則之城？</h2><span>這會清除 Gate 1～6 與 FINAL GATE 的遊戲進度，所有關卡將恢復為尚未完成。</span><div><button id="hallResetCancel" type="button">取消</button><button id="hallResetConfirmButton" type="button">全部重新開始</button></div></div>
    </section>
  </main>
  <script src="js/hall.js"></script>
</body>
</html>
