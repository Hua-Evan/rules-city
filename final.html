<body>
  <main class="app" aria-live="polite">
    <section id="introScreen" class="screen">
      <p class="eyebrow">RULES CITY · FINAL</p><h1>最終試煉</h1>
      <p class="lead">六道關卡都走到這裡了。<br>最後，看看你是不是真的理解這座城市的規則。</p>
      <div class="teacher-card paper"><div class="teacher-placeholder" aria-label="公民老師角色位置預留">公民老師<br>角色位置預留</div><div class="teacher-copy"><strong>最後一道考驗。</strong>一共 15 題。<br>完成所有題目後，才會公布分數與完整解析。</div></div>

  <script>
    const questions=[
      {type:"single",title:"法律保留原則",text:`某主管機關因網路詐騙案件增加，公告要求特定網路服務使用者完成實名登記，否則不得使用部分功能。部分使用者對主管機關是否得以公告方式限制其使用服務的自由提出質疑。
依上述爭議，最主要涉及下列哪一項憲法原則？`,options:["法律保留原則","信賴保護原則","誠實信用原則","禁止權利濫用原則"],answer:[0],explanation:"國家或行政機關限制人民基本權時，須先檢視是否有法律依據或法律明確授權。",topic:"法律保留原則"},
      {type:"single",title:"列舉基本權與概括基本權",text:`司法院釋字第 399 號指出，姓名是人格的表現，人民如何命名，與個人人格形成及自我認同密切相關，因此應受到憲法保障。
依上述解釋，下列敘述何者最適當？`,options:["姓名權屬於憲法明文列舉的基本權，因此直接受到憲法第 7 條至第 21 條保障","姓名權雖未由憲法明文列舉，仍可能依憲法第 22 條受到保障","姓名權屬於居住遷徙自由的一部分，因此應適用憲法第 10 條","凡憲法沒有明文列舉的權利，原則上都不屬於基本權"],answer:[1],explanation:"姓名權並未直接列在憲法第 7 條至第 21 條，但仍可透過第 22 條概括基本權受到保障。",topic:"列舉基本權、概括基本權、憲法第 22 條"},
      {type:"single",title:"法律案提案主體",text:`某住宅法案準備進入立法院審議。甲民間團體自行草擬版本並送交立法院；乙總統府提出修法版本；丙行政院提出院版草案；丁立法委員提出委員版草案，並取得 15 人以上連署；戊司法院就涉及司法制度的部分提出修法案；己則由 3 名立法委員組成的黨團，以黨團名義提出草案。
依我國法律案提案制度，下列敘述何者正確？`,options:["甲得以人民直接提案的方式，使草案進入立法院法律案審議程序","乙得基於總統的憲法地位，直接向立法院提出法律案","丁提出法律案時須符合立法委員提案的連署人數要求","己雖可成立黨團，但提出法律案時仍須另取得 15 人以上連署"],answer:[2],explanation:"人民及總統並非法律案的直接提案主體；立法委員提出法律案須符合連署規定；符合規定的黨團則可用黨團名義提案。",topic:"法律案提案主體、立委連署、黨團提案"},
      {type:"single",title:"一讀與逕付二讀",text:`某法律案在立法院第一讀會宣讀議案標題後，原本準備交付委員會審查。此時有立法委員主張不經委員會，直接進入下一階段審議，並獲得 20 人以上連署或附議，之後交由院會表決。
依我國立法程序，下列敘述何者最適當？`,options:["第一讀會已開始逐條審查，因此院會表決的是是否停止逐條討論","20 人以上連署或附議後，該法律案即直接進入二讀，無須再經院會決定","若院會表決通過，該法律案得不經委員會審查而逕付二讀","若院會表決通過，表示該法律案已完成二讀，可直接進行三讀"],answer:[2],explanation:"20 人以上連署或附議只是逕付二讀動議的程序條件，仍須經院會表決通過。",topic:"一讀、委員會審查、逕付二讀"},
      {type:"single",title:"平等權",text:`司法院釋字第 748 號處理相同性別二人婚姻自由的問題。當時《民法》婚姻制度使相同性別二人無法成立具有親密性及排他性的永久結合關係。大法官認為，此種限制除了涉及婚姻自由，也必須檢視以性傾向所形成的差別待遇是否符合憲法平等權的要求。
依上述案例，下列敘述何者最適當？`,options:["平等權要求法律對不同群體皆採取相同規範","差別待遇是否合憲，須檢視分類及其目的關聯","法律只要設有不同待遇，即構成平等權侵害","婚姻制度屬身分關係，原則上不受平等權審查"],answer:[1],explanation:"平等權並非要求所有人一律受到完全相同待遇；差別待遇仍須檢視其分類標準與規範目的。",topic:"平等權、差別待遇"},
      {type:"single",title:"比例原則子原則",text:`某法律為降低酒後駕車事故，規定駕駛人只要拒絕酒測，即一律吊銷駕照 10 年，不區分是否為初犯、酒測拒絕原因、是否實際造成事故，也不考慮其他較輕的處罰方式。
若從比例原則判斷，這項規定最可能首先涉及哪一項子原則的問題？`,options:["適合性原則：此措施是否有助於達成降低酒駕的目的","必要性原則：是否存在同樣有效、但對人民權利侵害較小的手段","衡量性原則：人民受限制的程度與公共利益之間是否明顯失衡","法律保留原則：是否具有法律明文依據"],answer:[1],explanation:"若存在同樣能達成目的、但侵害人民權利較小的方式，即涉及必要性原則。",topic:"比例原則、必要性原則"},
      {type:"single",title:"原則綜合判斷",text:`某政府在推動政策時出現下列情況：
甲：保障每位人民皆享有言論、信仰等基本自由，不因其社會地位而有所不同。
乙：政府對高所得者課徵較高稅負，並將部分資源用於改善弱勢者的教育與生活條件。
丙：主管機關欲限制人民使用某項公共設施，但現行法律並未提供相關依據。
丁：政府為維護公共安全限制大型活動人數，但限制程度是否超過達成目的所必要，受到質疑。
下列配對何者最適當？`,options:["甲—差異原則；乙—均等自由原則；丙—比例原則；丁—法律保留原則","甲—均等自由原則；乙—法律保留原則；丙—差異原則；丁—比例原則","甲—比例原則；乙—差異原則；丙—法律保留原則；丁—均等自由原則","甲—均等自由原則；乙—差異原則；丙—法律保留原則；丁—比例原則"],answer:[3],explanation:"甲為均等自由原則；乙為差異原則；丙涉及國家限制人民權利的法源問題，屬法律保留；丁則涉及限制手段是否過度，屬比例原則。",topic:"均等自由原則、差異原則、法律保留原則、比例原則"},
      {type:"single",title:"聲請主體 × 釋字第 718 號",text:`司法院釋字第 718 號的案件來源之一，是臺北地方法院與桃園地方法院法官在審理違反《集會遊行法》的刑事案件時，認為裁判所應適用的法律可能違憲，因此聲請大法官解釋；另外，也有人民因違反集會遊行法遭判刑確定後，認為判決所適用法律侵害集會自由而聲請解釋。
依上述案例，下列敘述何者最適當？`,options:["法院只有在案件判決確定後，才能就裁判所適用的法律聲請解釋","人民若認為法律侵害基本權，即使案件尚未確定也可以直接聲請解釋","法院與人民都可能成為聲請主體，但兩者須分別符合各自法定要件","法院與人民提出聲請時，都必須先取得確定終局裁判後才能進行"],answer:[2],explanation:"法院與人民都可能成為憲法審查聲請主體，但兩者的聲請條件並不相同。",topic:"違憲審查聲請主體"},
      {type:"single",title:"法規範審查與裁判憲法審查",text:`小林因訴訟案件敗訴，依法用盡審級救濟後取得確定終局裁判。他認為有兩個問題：第一，法院判決所適用的某項法律規定本身違反憲法；第二，即使該法律本身沒有違憲，法院在判決中對該法律所採取的解釋與適用方式，仍侵害其受憲法保障的權利。
依現行憲法訴訟制度，下列敘述何者最適當？`,options:["第一項爭議屬裁判憲法審查，第二項爭議屬法規範憲法審查","第一項爭議屬法規範憲法審查，第二項爭議可能涉及裁判憲法審查","兩項爭議皆屬法規範憲法審查，因為法院裁判本身不是審查對象","兩項爭議皆屬裁判憲法審查，因為人民只能針對確定判決提出聲請"],answer:[1],explanation:"法律規定本身是否違憲，屬法規範憲法審查；確定終局裁判所採取的法律見解是否侵害基本權，則可能涉及裁判憲法審查。",topic:"法規範憲法審查、裁判憲法審查"},
      {type:"multiple",title:"正式與非正式社會控制",text:`某藝人在公共場所吸菸遭民眾拍攝後，相關畫面在社群媒體大量流傳，不少網友留言批評其行為，合作廠商也宣布暫停代言活動。其後，衛生主管機關查明吸菸地點屬法律禁止吸菸的場所，依法對其裁處罰鍰。

      {type:"matching",title:"法律解釋方法",text:"請判斷下列案例主要採用了哪一種法律解釋方法。",pairs:[{text:"A. 租賃法律規定某項保障適用於「住宅租賃」，法院從一般語言中「住宅」通常所指的意思，判斷學生長期居住的套房是否包含在內。",answer:"① 文義解釋"},{text:"B. 某法條要求未成年人進行特定法律行為時取得法定代理人同意，但同一部法律另有日常生活行為的例外，法院將兩條規定一起理解。",answer:"② 體系解釋"},{text:"C. 法院對法律中的「重大事故」範圍產生疑問，因此查閱當年立法院委員會紀錄、草案說明及修法理由。",answer:"③ 歷史解釋"},{text:"D. 公園規定禁止「車輛」進入，法院考量規定目的在維護行人安全及公園安寧，判斷電動滑板車是否也應包括在內。",answer:"④ 目的解釋"}],choices:["① 文義解釋","② 體系解釋","③ 歷史解釋","④ 目的解釋"],explanation:"文義解釋：從法律文字的一般或可能意義理解條文。\n體系解釋：將條文放進整部法律或其他相關規範中理解。\n歷史解釋：參考立法資料、修法理由與制定背景。\n目的解釋：依法律希望達成的規範目的解釋條文。",topic:"法律解釋方法"}
    ];
    const TOTAL_QUESTIONS=15;
    const testMode=new URLSearchParams(window.location.search).get("test")==="1";
    const allGatesCompleted=[1,2,3,4,5,6].every(gate=>localStorage.getItem(`gate${gate}Completed`)==="true");
    const finalUnlocked=localStorage.getItem("rulesCityFinalUnlocked")==="true";
    if(!testMode&&!(allGatesCompleted&&finalUnlocked))window.location.replace("index.html");
    const POINTS={single:5,multiple:9,matching:10};
    let current=0,answers=[],startTime=null,elapsed=0,timerHandle=null,lastResults=[];
    const $=id=>document.getElementById(id);
    const screens=[$("introScreen"),$("quizScreen"),$("resultScreen"),$("reviewScreen")];
    function show(screen){screens.forEach(item=>item.classList.add("hidden"));screen.classList.remove("hidden")}
    function formatTime(seconds){return `${String(Math.floor(seconds/60)).padStart(2,"0")}:${String(seconds%60).padStart(2,"0")}`}
    function formatPoints(points){return Number.isInteger(points)?String(points):String(Number(points.toFixed(2)))}
    function scrollTop(){window.scrollTo({top:0,behavior:window.matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}
    function letter(index){return String.fromCharCode(65+index)}
    function startTimer(){startTime=Date.now();timerHandle=setInterval(()=>{elapsed=Math.floor((Date.now()-startTime)/1000);$("timer").textContent=formatTime(elapsed)},1000)}
    function stopTimer(){clearInterval(timerHandle);timerHandle=null}
    function fullCorrect(q,answer){if(q.type==="matching")return q.pairs.every((pair,index)=>pair.answer===answer[index]);return JSON.stringify([...q.answer].sort())===JSON.stringify([...answer].sort())}
    function earnedPoints(q,answer){if(q.type==="single")return fullCorrect(q,answer)?5:0;if(q.type==="matching")return q.pairs.reduce((sum,pair,index)=>sum+(pair.answer===answer[index]?2.5:0),0);const unit=9/q.answer.length;const correct=answer.filter(index=>q.answer.includes(index)).length;const incorrect=answer.filter(index=>!q.answer.includes(index)).length;return Math.max(0,correct*unit-incorrect*unit)}
    function questionTypeLabel(q){return q.type==="single"?"單選題｜5 分":q.type==="multiple"?"多選題｜9 分":"配對題｜10 分"}
    function startQuiz(){current=0;answers=[];elapsed=0;lastResults=[];$("timer").textContent="00:00";show($("quizScreen"));startTimer();renderQuestion();scrollTop()}
    function renderQuestion(){const q=questions[current];$("counter").textContent=`第 ${current+1} / ${TOTAL_QUESTIONS} 題`;$("progressFill").style.width=`${((current+1)/TOTAL_QUESTIONS)*100}%`;$("qType").textContent=questionTypeLabel(q);$("qText").textContent=q.text;const options=$("options"),matching=$("matching"),submit=$("submitBtn");options.innerHTML="";matching.innerHTML="";submit.disabled=true;if(q.type==="single"||q.type==="multiple"){options.classList.remove("hidden");matching.classList.add("hidden");const selected=new Set();q.options.forEach((label,index)=>{const button=document.createElement("button");button.type="button";button.className="option";button.innerHTML=`<span class="option-label">${letter(index)}.</span>${label}`;button.onclick=()=>{if(q.type==="single"){selected.clear();[...options.children].forEach(item=>item.classList.remove("selected"));selected.add(index);button.classList.add("selected")}else{selected.has(index)?(selected.delete(index),button.classList.remove("selected")):(selected.add(index),button.classList.add("selected"))}submit.disabled=selected.size===0};options.appendChild(button)});submit.onclick=()=>{answers[current]=[...selected].sort((a,b)=>a-b);nextQuestion()};return}options.classList.add("hidden");matching.classList.remove("hidden");q.pairs.forEach((pair,index)=>{const row=document.createElement("div");row.className="match-row";row.innerHTML=`<div class="match-text">${pair.text}</div><select aria-label="${letter(index)} 配對答案"><option value="">請選擇</option>${q.choices.map(choice=>`<option value="${choice}">${choice}</option>`).join("")}</select>`;matching.appendChild(row)});const selects=[...matching.querySelectorAll("select")];selects.forEach(select=>select.onchange=()=>submit.disabled=selects.some(item=>!item.value));submit.onclick=()=>{answers[current]=selects.map(select=>select.value);nextQuestion()}}
    function nextQuestion(){current+=1;if(current<TOTAL_QUESTIONS){renderQuestion();scrollTop()}else finishQuiz()}
    function finishQuiz(){stopTimer();lastResults=questions.map((q,index)=>({question:q,answer:answers[index],isFullyCorrect:fullCorrect(q,answers[index]),points:earnedPoints(q,answers[index])}));const total=lastResults.reduce((sum,result)=>sum+result.points,0);const correct=lastResults.filter(result=>result.isFullyCorrect).length;$("scoreBig").textContent=String(Math.round(total));$("correctCount").textContent=`${correct} / ${TOTAL_QUESTIONS}`;$("accuracy").textContent=`${Math.round(correct/TOTAL_QUESTIONS*100)}%`;$("finalTime").textContent=formatTime(elapsed);const resultPrefix=testMode?"rulesCityFinalTest":"rulesCityFinal";if(!testMode)localStorage.setItem("rulesCityFinalCompleted","true");localStorage.setItem(`${resultPrefix}LastScore`,String(total));localStorage.setItem(`${resultPrefix}LastTime`,String(elapsed));localStorage.setItem(`${resultPrefix}LastCorrect`,String(correct));if(!testMode)localStorage.setItem("rulesCityFinalCompletedAt",new Date().toISOString());show($("resultScreen"));scrollTop()}
    function answerText(q,answer,correct=false){if(q.type==="matching")return q.pairs.map((pair,index)=>`${letter(index)}－${correct?pair.answer:answer[index]}`).join("；");const indexes=correct?q.answer:answer;return indexes.map(index=>`${letter(index)}. ${q.options[index]}`).join("、")}
    function renderReview(){const wrong=lastResults.filter(result=>!result.isFullyCorrect);$("reviewSummary").textContent=wrong.length?`共 ${wrong.length} 題需要再確認。`:"全部答對，沒有錯題。";const list=$("reviewList");list.innerHTML="";wrong.forEach((result,order)=>{const{question:q,answer,points}=result;const card=document.createElement("article");card.className="review-card";card.innerHTML=`<div class="review-q">錯題 ${order+1}｜${q.title}</div><div class="review-line wrong"><strong>我的答案</strong>${answerText(q,answer)}</div><div class="review-line right"><strong>正確答案</strong>${answerText(q,q.answer,true)}</div><div class="explain">${q.explanation}</div><div class="topic">本題考點：${q.topic}</div><div class="points">本題配分：${formatPoints(POINTS[q.type])} 分</div><div class="points">本題得分：${formatPoints(points)} / ${formatPoints(POINTS[q.type])}</div>`;list.appendChild(card)})}
    $("startBtn").onclick=startQuiz;$("reviewBtn").onclick=()=>{renderReview();show($("reviewScreen"));scrollTop()};$("restartBtn").onclick=startQuiz;$("backResultBtn").onclick=()=>{show($("resultScreen"));scrollTop()};$("returnBtn").onclick=()=>window.location.assign("index.html");
  </script>
